[project]
name = "reproducible-agents-biomedical-kg"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "openai>=3.37.0",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "reportlab>=5.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
